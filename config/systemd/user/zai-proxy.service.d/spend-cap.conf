[Service]
# D6 (2026-09-02) burn-reduction: real caps again.
# SPEND_CAP_MANAGER/WORKER are display-only tier caps for /spend.
# SPEND_CAP_METERED is the live cash circuit breaker (metered providers
# only — neuralwatt/routstr/routstrd/deepinfra/telnyx/ppq/openrouter;
# see _check_global_spend_cap in zai_proxy.py).
# Canonical copy — deployed to ~/.config/systemd/user/zai-proxy.service.d/
# on DQ05 by scripts/deploy-dq05-proxy.sh.
Environment=SPEND_CAP_MANAGER=999999
Environment=SPEND_CAP_WORKER=999999
Environment=SPEND_CAP_METERED=25
