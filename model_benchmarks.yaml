# ── model_benchmarks.yaml — per-model capability snapshot ──────────────────
#	Input to tier resolution (ADR: benchmark-tier model resolution).
#	Filter:  model must satisfy tier minima (context, coding_class,
#	         tool_use) to enter the tier candidate pool.
#	Provenance: EVERY entry carries an `evidence:` line. Scores without
#	provenance are forbidden — stale or unsourced floors are how bad
#	models sneak into routing.
#	Coding classes (ordered): economy < solid < pro
#	tool_use (ordered):        ok < good < strong
#	Context windows marked "assumed" come from fleet profile configs
#	(hermes-side operating assumption), NOT provider-verified — verify
#	via canary before relying on them for tight-tier filtering.
#	stale_after_days: if the best candidate in a resolving pool is older
#	than this, log reason=stale_benchmarks (warn, never block).

